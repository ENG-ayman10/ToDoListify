<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="/src/output.css">
    <title>Welcome</title>
</head>
<body class="w-full h-screen bg-[url(/Images/welcome/background.png)] bg-no-repeat bg-center bg-[auto_500px] md:bg-center md:bg-[auto_600px] lg:bg-contain" >

    <div class="relative h-full">

        <header class="h-[180px] border-r-2 border-b-2 border-black rounded-b-[52px] relative bg-primary-color">
            <!-- Semi Circle -->
            <div class=" w-56 h-36 left-1/2 -translate-x-1/2 md:w-[384px] md:h-[132px] relative top-40">
                <img src="/Images/welcome/Ellipse 4.png" alt="" class="absolute top-2" >
                <img src="/Images/welcome/Ellipse 5.png" alt="" class="absolute">
                
                <div class="absolute w-full left-1/2 -translate-x-20 md:left-10 md:translate-x-0.5 md:h-full ">
                    <p class="font-inter-900 italic w-full text-2xl text-black font-black md:h-full  md:text-[48px]">
                        TO DO Listify
                    </p>

                    <span class="absolute w-[133px] left-1 top-6.5 rounded-r-2xl rounded-l-2xl h-0.5 bg-white md:block md:top-13.5 md:left-2 md:w-[265px] md:h-1"></span>
                </div>
            </div>
        </header>


        <!-- Main Section -->
        <main class="absolute bottom-0 flex flex-col w-full h-8/12 space-y-8 md:text-center md:w-full md:top-[300px] md:left-0 md:bg-transparent md:mt-52 md:h-0 md:p-10 lg:w-[1326px] lg:left-[80px] lg:md:mt-0">

            <!-- Buttons -->
            <div class="w-full absolute bottom-0 h-4/12 rounded-t-[40px] flex justify-evenly items-center bg-primary-color md:bg-transparent md:pt-5 md:items-start md:relative md:rounded-t-0 lg:h-0">
                <a href="./sign_in.html" class="w-[157px] h-[59px] font-inter-600 border-black drop-shadow-lg cursor-pointer flex justify-center items-center rounded-[52px] border text-white bg-black font-semibold text-[18px] hover:text-primary-color md:w-[183px] md:h-[86px] md:text-[40px] active:scale-95">Sign In</a>
                <a href="./register.html" class="w-[157px] h-[59px] font-inter-600 text-[18px] rounded-[52px] border drop-shadow-lg text-black font-semibold border-white bg-white cursor-pointer flex justify-center items-center active:scale-95 hover:text-primary-color md:w-[183px] md:h-[86px] md:bg-primary-color md:text-[40px] md:hover:text-white">Sign Up</a>
