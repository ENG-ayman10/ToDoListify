<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/output.css" />
    <title>Settings</title>
  </head>
  <body class="h-screen">
    <div class="h-full">
      <header
        class="h-[10%] w-full bg-primary-color border-3 border-t-0 rounded-b-[52px] border-black px-8 shadow-[1px_5px_4px_0px_#00000040] md:shadow-none md:h-2/12 md:rounded-br-[52px] md:rounded-b-none md:border-b-2 md:border-r-2 md:border-l-0"
      >
        <div class="h-full flex items-center space-x-5 relative ">
          <div class="relative">
            <h1
              class="font-inter-900 italic text-[36px] md:text-5xl text-black hidden md:block"
            >
              TO DO Listify
            </h1>
            <span
              class="hidden absolute left-2 w-[265px] rounded-r-2xl rounded-l-2xl h-1 bg-white md:block"
            ></span>
          </div>
          <!-- White Aside Line -->
          <span class="h-8 bg-white rounded-lg w-2 mt-4 hidden md:block"></span>
          <div class="absolute left-0 md:relative">
            <h1
              class="font-inter-900 italic text-[36px] md:text-5xl text-black md:mt-5"
            >
              Settings
            </h1>
          </div>
          <button class="font-inter-900 w-24 h-8 rounded-full bg-black text-white text-[16px] col-span-2 absolute right-0 md:col-span-2 justify-self-center cursor-pointer hover:text-primary-color active:scale-95 md:w-36 md:h-16 md:text-2xl md:font-inter-600">LogOut</button>
        </div>
      </header>

      <div class="h-[78%] w-full flex md:h-5/6">
        <aside
          class="h-full w-[12%] bg-primary-color rounded-br-[52px] hidden md:block lg:w-[7%]"
        >
          <div class="w-full h-full flex flex-col items-center pt-5 space-y-6">
            <a href="settings.html"
              class="bg-white h-18 w-26 ml-5 rounded-l-full flex items-center pl-6 pt-3"
            >
              <img src="/Images/icons/person.png" alt="" class="h-14 w-9"/>
            </a>
            <a href="#"
              class="bg-white size-18 flex items-center border-3 justify-center rounded-full"
            >
              <img src="/Images/icons/home.png" alt="" />
            </a>
            <a href="search.html"
              class="bg-white size-18 flex items-center border-3 justify-center rounded-full"
            >
              <img src="/Images/icons/search.png" alt="" />
            </a>
            <a href="#"
              class="bg-white size-18 flex items-center border-3 justify-center rounded-full"
            >
              <img src="/Images/icons/plus.png" alt="" />
            </a>
          </div>
        </aside>

        <main class="h-full w-full pt-4 p-12 md:pl-16 md:pt-12">
          <div class="flex flex-col items-center gap-x-10 md:flex-row">
            <div class="size-32 rounded-full border-black border bg-primary-color relative shadow-[1px_5px_4px_0px_#00000040] md:size-48">
              <img src="/Images/icons/person.png" alt="" class="h-32 absolute left-1/2 -translate-x-1/2 top-1/2 md:h-48 md:w-32 -translate-y-5/12">
            </div>
            <div>
              <h3 class="font-inter-900 italic text-2xl w-80 h-12 flex justify-center items-center ">Mohammed Abdullah</h3>
              <h3 class="font-inter-900 italic text-2xl w-80 h-12 flex justify-center items-center bg-primary-color rounded-full">Mohammed@gmail.com</h3>
            </div>
          </div>
          <!-- Buttons Container -->
          <div class="grid grid-cols-1 justify-items-center gap-y-4 w-full mt-8 md:grid-cols-2 md:gap-y-20">
            <button
                class="w-[350px] h-16 rounded-full bg-black text-white font-inter-900 italic text-2xl cursor-pointer hover:text-primary-color active:scale-95 md:w-72 md:h-20 md:text-3xl lg:w-[400px]"
              >
              Edit Profile
              </button>
            <button
                class="w-[350px] h-16 rounded-full bg-black text-white font-inter-900 italic text-2xl cursor-pointer hover:text-primary-color active:scale-95 md:w-72 md:h-20 md:text-3xl lg:w-[400px]"
              >
              Dark Mode
              </button>
            <button
                class="w-[350px] h-16 rounded-full bg-black text-white font-inter-900 italic text-2xl cursor-pointer hover:text-primary-color active:scale-95 md:w-72 md:h-20 md:text-3xl lg:w-[400px]"
              >
              Delete Account
              </button>
          </div>
        </main>
      </div>

      <footer class="w-full h-[12%] rounded-t-[40px] border-2 border-black flex justify-between px-5 items-center bg-primary-color md:bg-transparent md:h-0 md:pt-5 md:items-start md:relative md:rounded-t-0 md:hidden ">
        <a href="#"
        class="bg-white size-16 flex items-center border-3 justify-center rounded-full"
      >
        <img src="/Images/icons/home.png" alt="" />
      </a>
      <a href="#" class="bg-white size-16 flex items-center border-3 justify-center rounded-full">
            <img src="/Images/icons/plus.png" alt=""  />
      </a>
      <a href="#" class="bg-white size-16 flex items-center justify-center rounded-full pt-3">
            <img src="/Images/icons/person.png" alt="" class="h-14 w-9"/>
      </a>
      </footer>
    </div>
  </body>
</html>
