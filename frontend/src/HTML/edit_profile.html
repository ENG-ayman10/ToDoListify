<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
    <!-- <link
      rel="stylesheet"
      href="/node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    /> -->
    <link rel="stylesheet" href="/src/output.css" />
  </head>
  <body class="h-screen">
    <div class="h-full">
      <header
        class="h-[10%] w-full bg-primary-color border-3 border-t-0 rounded-b-[52px] border-black px-8 shadow-[1px_5px_4px_0px_#00000040] md:shadow-none md:h-2/12 md:rounded-br-[52px] md:rounded-b-none md:border-b-2 md:border-r-2 md:border-l-0"
      >
        <div class="h-full flex items-center space-x-5 relative">
          <div class="relative">
            <h1
              class="font-inter-900 italic text-[36px] md:text-5xl text-black hidden md:block"
            >
              TO DO Listify
            </h1>
            <span
              class="hidden absolute left-2 w-[265px] rounded-r-2xl rounded-l-2xl h-1 bg-white md:block"
            ></span>
          </div>
          <!-- White Aside Line -->
          <span class="h-8 bg-white rounded-lg w-2 mt-4 hidden md:block"></span>
          <div class="absolute left-0 md:relative flex items-center">
            <!-- Mobile Back Arrow -->
            <div
              class="circle p-2 flex items-center justify-center w-[50px] h-[50px] bg-black rounded-full hover:bg-[#efb700] transition duration-300 relative -top-2 md:-top-2 -left-6 md:hidden mr-3"
            >
              <a
                href="/src/HTML/settings.html"
                class="text-3xl font-bold text-[#efb700] hover:text-black transition duration-300"
                >&larr;</a
              >
            </div>
            <h1
              class="font-inter-900 italic text-[36px] md:text-5xl text-black md:mt-5"
            >
              Edit Profile
            </h1>
          </div>
        </div>
      </header>
      <div class="h-[90%] w-full flex md:h-5/6">
        <main class="flex flex-col items-center w-full max-w-2xl md:px-5">
          <div
            class="flex items-start justify-between w-full px-4 md:px-10 mt-5"
          >
            <div
              class="hidden circle p-1 md:flex items-center justify-center w-[50px] h-[50px] bg-black rounded-full hover:bg-[#efb700] transition duration-300 relative -top-2 md:-top-2 md:-left-6"
            >
              <a
                href="/src/HTML/settings.html"
                class="back-btn text-[35px] mb-1 font-bold text-[#efb700] hover:text-white transition duration-300"
                >&larr;</a
              >
            </div>
            <!-- Profile Icon -->
            <div
              class="w-[180px] h-[180px] rounded-full bg-[#efb700] flex items-center justify-center mx-auto md:mx-0 md:mr-70"
            >
              <img
                src="/Images/icons/person.png"
                alt="User"
                class="w-[114px] h-[160px] mt-5"
              />
            </div>
          </div>
          <!-- Form -->
          <form
            action=""
            class="w-full space-y-4 pl-4 pr-4 md:pl-1 md:pr-1 md:ml-[650px]"
          >
            <!-- Full Name -->
            <div class="relative">
              <label class="font-inter-900 ml-4 md:hidden">Full Name:</label>
              <input
                id="fullname"
                type="text"
                placeholder="Full Name"
                required
                class="input-field placeholder:opacity-0 w-full bg-[#efb700] text-black md:h-[70px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full md:placeholder:opacity-100"
              />
              <span>
                <img
                  src="/Images/Polygon 1.png"
                  alt=""
                  class="hidden absolute left-36 bottom-1 transform -translate-y-1/2 w-5 md:block"
                />
              </span>
            </div>

            <!-- Email -->
            <div class="relative">
              <label class="font-inter-900 ml-4 md:hidden">Email:</label>
              <input
                id="email"
                type="email"
                placeholder="Email"
                required
                class="input-field placeholder:opacity-0 w-full bg-[#efb700] text-black md:h-[70px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full md:placeholder:opacity-100"
              />
              <span>
                <img
                  src="/Images/Polygon 1.png"
                  alt=""
                  class="hidden absolute left-36 bottom-1 transform -translate-y-1/2 w-5 md:block"
                />
              </span>
            </div>

            <!-- Username -->
            <div class="relative">
              <label class="font-inter-900 ml-4 md:hidden">Username:</label>
              <input
                id="username"
                type="text"
                placeholder="User Name"
                required
                class="input-field placeholder:opacity-0 w-full bg-[#efb700] text-black md:h-[70px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full md:placeholder:opacity-100"
              />
              <span>
                <img
                  src="/Images/Polygon 1.png"
                  alt=""
                  class="hidden absolute left-36 bottom-1 transform -translate-y-1/2 w-5 md:block"
                />
              </span>
            </div>

            <!-- Change Password -->
            <div class="flex items-center justify-center">
              <button
                id="openModal"
                class="flex items-center gap-2 w-[350px] h-[60px] bg-[#efb700] text-white font-bold text-[19px] py-2 px-20 rounded-full shadow-md hover:bg-[#d9a600] transition"
              >
                Change Password
                <i class="fa-solid fa-lock text-black text-[20px]"></i>
              </button>
            </div>

            <!-- [First] Modal (Correct Password)-->
            <div
              id="modal"
              class="hidden fixed inset-0 items-center justify-center bg-black bg-opacity-50"
            >
              <div
                class="bg-white p-6 rounded-lg shadow-lg w-[400px] text-center relative"
              >
                <!-- Cancel button (X) -->
                <button
                  id="cancelModal"
                  class="absolute top-2 right-2 text-gray-600 hover:text-red-500"
                >
                  ✖
                </button>

                <div class="flex justify-center mb-4">
                  <i class="fas fa-lock text-black text-[40px]"></i>
                </div>

                <h2 class="text-xl font-bold text-black italic">
                  Change <span class="text-[#efb700]">Password</span>
                </h2>

                <label for="password" class="block text-gray-700 mt-4"
                  >Enter Password:</label
                >

                <div class="relative mt-2">
                  <input
                    type="password"
                    id="password"
                    class="w-full px-4 py-2 border rounded-full bg-[#efb700] text-white focus:outline-none"
                    placeholder="********"
                  />
                  <button
                    id="togglePassword"
                    class="absolute right-3 top-3 cursor-pointer"
                  >
                    <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
                  </button>
                </div>

                <!-- Next Botton -->
                <button
                  id="nextStep"
                  type="button"
                  class="mt-4 bg-black text-white px-6 py-2 rounded-full shadow-lg hover:bg-gray-800 transition"
                >
                  Next
                </button>
              </div>
            </div>
            <!-- Second Modal (New Password) -->
            <div
              id="newPasswordModal"
              class="hidden fixed inset-0 items-center justify-center bg-black bg-opacity-50"
            >
              <div
                class="bg-white p-6 rounded-lg shadow-lg w-[400px] text-center relative"
              >
                <!-- Cancel button (X) -->
                <button
                  id="closeNewPasswordModal"
                  class="absolute top-2 right-2 text-gray-600 hover:text-red-500"
                >
                  ✖
                </button>

                <div class="flex justify-center mb-4">
                  <i class="fas fa-key text-black text-[40px]"></i>
                </div>

                <h2 class="text-xl font-bold text-black italic">
                  Set <span class="text-[#efb700]">New Password</span>
                </h2>

                <!-- New Password Input -->
                <label for="newPassword" class="block text-gray-700 mt-4"
                  >New Password:</label
                >
                <input
                  type="password"
                  id="newPassword"
                  class="w-full px-4 py-2 border rounded-full bg-[#efb700] text-white focus:outline-none"
                  placeholder="********"
                />

                <!-- Confirm Password Input -->
                <label for="confirmPassword" class="block text-gray-700 mt-4"
                  >Confirm Password:</label
                >
                <input
                  type="password"
                  id="confirmPassword"
                  class="w-full px-4 py-2 border rounded-full bg-[#efb700] text-white focus:outline-none"
                  placeholder="********"
                />

                <!-- Submit Button -->
                <button
                  id="submitNewPassword"
                  type="button"
                  class="mt-4 bg-black text-white px-6 py-2 rounded-full shadow-lg hover:bg-gray-800 transition"
                >
                  Save
                </button>
              </div>
            </div>

            <!-- Save Button -->
            <div class="flex items-center justify-center">
              <button
                id="submitNewData"
                type="submit"
                class="bg-black text-white font-bold text-[18px] py-3 px-12 rounded-full hover:text-[#efb700] transition"
              >
                Save
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>
    <script src="/node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="/node_modules/axios/dist/axios.min.js"></script>
    <script src="/js/edit_profile.js" type="module"></script>
  </body>
</html>
