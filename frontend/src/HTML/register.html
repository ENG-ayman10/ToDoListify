<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="/src/output.css" />
    <link
      rel="stylesheet"
      href="/node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      main {
        flex-grow: 1;
      }
    </style>
  </head>
  <body
    class="bg-[url('/Images/log_in_up/back2.png')] bg-cover bg-center bg-fixed"
  >
    <nav class="relative md:p-1 w-full">
      <div class="flex items-center justify-between w-full px-6">
        <div
          class="circle p-2 flex items-center justify-center w-[50px] h-[50px] bg-black rounded-full hover:bg-[#efb700] transition duration-300"
        >
          <a
            href="javascript:history.back()"
            class="back-btn text-[35px] mb-1 font-bold text-[#efb700] hover:text-white transition duration-300"
            >&larr;</a
          >
        </div>
        <a
          href="/src/HTML/sign_in.html"
          class="signin-link p-3 px-6 text-[23px] md:text-[25px] font-bold text-black hover:text-[#efb700] transition duration-300"
          >Sign In</a
        >
      </div>
    </nav>

    <main class="flex flex-col items-start w-full md:relative relative">
      <h1
        class="title font-inter-900-italic text-6xl p-2 ml-[150px] font-bold md:text-[76px] leading-[1.4] text-center md:text-left md:ml-[260px] md:mt-[-55px]"
      >
        Sign Up
      </h1>
      <div
        class="relative w-full max-w-4xl px-6 py-10 h-auto rounded-t-[50px] space-y-3 z-10 md:bg-transparent bg-[#efb700] md:py-30"
      >
        <h2
          class="font-inter-900-italic text-4xl font-bold text-black text-center mb-5 md:hidden"
        >
          Create an Account
        </h2>
        <form action="" class="w-full">
          <div
            class="flex flex-col space-y-6 md:flex-col md:space-y-2.5 md:justify-between w-full md:ml-[300px] relative md:-top-[120px]"
          >
            <!-- Fullname Input -->
            <div class="relative w-full">
              <label class="font-inter-900 ml-4 md:hidden">Full Name:</label>
              <input
                id="fullname"
                type="text"
                placeholder="FullName"
                required
                class="input-field w-full bg-white text-black md:h-[60px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full"
              />
              <span class="absolute left-32 top-1/2 transform -translate-y-1/2">
                <img src="/Images/Polygon 1.png" alt="" class="w-6" />
              </span>
            </div>

            <!-- Email Input -->
            <div class="relative w-full">
              <label class="font-inter-900 ml-4 md:hidden">Email:</label>
              <input
                id="email"
                type="email"
                placeholder="Email"
                required
                class="input-field w-full bg-white text-black md:h-[60px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full"
              />
              <span class="absolute left-32 top-1/2 transform -translate-y-1/2">
                <img src="/Images/Polygon 1.png" alt="" class="w-6" />
              </span>
            </div>

            <!-- Username Input -->
            <div class="relative w-full">
              <label class="font-inter-900 ml-4 md:hidden">Username:</label>
              <input
                id="username"
                type="text"
                placeholder="Username"
                required
                class="input-field w-full bg-white text-black md:h-[60px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full"
              />
              <span class="absolute left-32 top-1/2 transform -translate-y-1/2">
                <img src="/Images/Polygon 1.png" alt="" class="w-6" />
              </span>
            </div>

            <!-- Password Input -->
            <div class="relative w-full">
              <label class="font-inter-900 ml-4 md:hidden">Password:</label>
              <input
                id="password"
                type="password"
                placeholder="Password"
                required
                class="input-field w-full bg-white text-black md:h-[60px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full"
              />
              <span class="absolute left-32 top-1/2 transform -translate-y-1/2">
                <img src="/Images/Polygon 1.png" alt="" class="w-6" />
              </span>
              <button
                type="button"
                id="togglePassword1"
                class="absolute right-5 mt-7 text-black md:transform -translate-y-1/2 md:mt-7 md:text-white text-xl focus:outline-none"
              >
                <i id="eyeIcon1" class="fa-solid fa-eye-slash"></i>
              </button>
            </div>
            <!-- Confirm Password Input -->
            <div class="relative w-full">
              <label class="font-inter-900 ml-4 md:hidden"
                >Confirm Password:</label
              >
              <input
                id="confirm_password"
                type="password"
                placeholder="Confirm Password"
                required
                class="input-field w-full bg-white text-black md:h-[60px] p-[5px] md:bg-[#efb700] border-[5px] border-white shadow-[10px_10px_10px_0px_#00000040] rounded-full md:text-white text-[25px] placeholder-white font-bold outline-none md:w-full"
              />
              <span class="absolute left-57 top-1/2 transform -translate-y-1/2">
                <img src="/Images/Polygon 1.png" alt="" class="w-6" />
              </span>
              <button
                type="button"
                id="togglePassword2"
                class="absolute right-5 mt-7 text-black md:transform -translate-y-1/2 md:mt-7 md:text-white text-xl focus:outline-none"
              >
                <i id="eyeIcon2" class="fa-solid fa-eye-slash"></i>
              </button>
            </div>
          </div>

          <!-- Sign Up Button -->
          <button
            id="signup"
            type="submit"
            class="sign-in-btn w-[180px] h-[80px] mx-auto mt-6 flex items-center justify-center text-[28px] font-bold bg-black text-white py-10 px-8 rounded-full shadow-lg border-none cursor-pointer relative z-50 hover:text-[#efb700] transition duration-400 md:ml-[640px] md:mt-[-90px]"
          >
            Sign Up
          </button>
        </form>
      </div>
    </main>

    <!-- Footer Waves -->
    <footer
      class="wave-footer w-full mt-auto relative hidden md:fixed md:bottom-0 md:left-0 md:block"
    >
      <svg
        viewBox="0 0 1440 320"
        class="wave-back absolute bottom-0 w-full opacity-50"
      >
        <path
          fill="#FFD766"
          fill-opacity="1"
          d="M0,160L48,170.7C96,181,192,203,288,197.3C384,192,480,160,576,160C672,160,768,192,864,213.3C960,235,1056,245,1152,240C1248,235,1344,213,1392,202.7L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"
        />
      </svg>
      <svg
        viewBox="0 0 1440 320"
        class="wave-front absolute bottom-0 w-full -mt-[60px]"
      >
        <path
          fill="#F7A900"
          fill-opacity="1"
          d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,138.7C1248,139,1344,181,1392,202.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"
        />
      </svg>
    </footer>
    <script src="/node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="/node_modules/axios/dist/axios.min.js"></script>
    <script src="/js/scSignup.js" type="module"></script>
  </body>
</html>
